<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 660" role="img" aria-labelledby="ntitle ndesc">
  <title id="ntitle">Datavision numerological name chart</title>
  <desc id="ndesc">A three by three Lo Shu grid. Numbers three, six and nine sit on the top row, two and five on the middle row with eight absent, and one, four and seven on the bottom row with seven absent. Four complete arrows of Pythagoras are drawn: one to two to three, three to six to nine, four to five to six, and one to five to nine. Columns are labelled Physical, Mind and Spiritual.</desc>

  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A86C9"/>
    </marker>
  </defs>

  <rect width="620" height="660" fill="none"/>

  <!-- grid cells -->
  <g fill="none" stroke="#D7DEEB" stroke-width="1.5">
    <rect x="40"  y="40"  width="160" height="160" rx="4"/>
    <rect x="220" y="40"  width="160" height="160" rx="4"/>
    <rect x="400" y="40"  width="160" height="160" rx="4"/>
    <rect x="40"  y="220" width="160" height="160" rx="4"/>
    <rect x="220" y="220" width="160" height="160" rx="4"/>
    <rect x="400" y="220" width="160" height="160" rx="4"/>
    <rect x="40"  y="400" width="160" height="160" rx="4"/>
    <rect x="220" y="400" width="160" height="160" rx="4"/>
    <rect x="400" y="400" width="160" height="160" rx="4"/>
  </g>

  <!-- arrows of Pythagoras: the four complete lines -->
  <g stroke="#4A86C9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowNavy)" fill="none">
    <!-- 1 to 2 to 3, the planner -->
    <line x1="120" y1="434" x2="120" y2="166"/>
    <!-- 3 to 6 to 9, the intellect -->
    <line x1="166" y1="120" x2="434" y2="120"/>
    <!-- 4 to 5 to 6, will and determination -->
    <line x1="300" y1="434" x2="300" y2="166"/>
    <!-- 1 to 5 to 9, the line of actualisation -->
    <line x1="152" y1="448" x2="448" y2="152"/>
  </g>

  <!-- present numbers -->
  <g>
    <circle cx="120" cy="120" r="38" fill="#FFFFFF" stroke="#151444" stroke-width="2.5"/>
    <circle cx="300" cy="120" r="38" fill="#FFFFFF" stroke="#151444" stroke-width="2.5"/>
    <circle cx="480" cy="120" r="38" fill="#FFFFFF" stroke="#151444" stroke-width="2.5"/>
    <circle cx="120" cy="300" r="38" fill="#FFFFFF" stroke="#151444" stroke-width="2.5"/>
    <circle cx="300" cy="300" r="38" fill="#FFFFFF" stroke="#151444" stroke-width="2.5"/>
    <circle cx="120" cy="480" r="38" fill="#FFFFFF" stroke="#151444" stroke-width="2.5"/>
    <circle cx="300" cy="480" r="38" fill="#FFFFFF" stroke="#151444" stroke-width="2.5"/>
    <!-- inner ring marks a repeated digit -->
    <circle cx="120" cy="120" r="31" fill="none" stroke="#151444" stroke-width="1.2"/>
    <circle cx="120" cy="300" r="31" fill="none" stroke="#151444" stroke-width="1.2"/>
    <circle cx="300" cy="300" r="31" fill="none" stroke="#151444" stroke-width="1.2"/>
    <circle cx="120" cy="480" r="31" fill="none" stroke="#151444" stroke-width="1.2"/>
    <circle cx="120" cy="480" r="24" fill="none" stroke="#151444" stroke-width="1.2"/>
  </g>

  <!-- absent numbers -->
  <g>
    <circle cx="480" cy="300" r="38" fill="none" stroke="#C3CBDA" stroke-width="2" stroke-dasharray="5 6"/>
    <circle cx="480" cy="480" r="38" fill="none" stroke="#C3CBDA" stroke-width="2" stroke-dasharray="5 6"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="42" text-anchor="middle" fill="#151444">
    <text x="120" y="135">3</text>
    <text x="300" y="135">6</text>
    <text x="480" y="135">9</text>
    <text x="120" y="315">2</text>
    <text x="300" y="315">5</text>
    <text x="120" y="495">1</text>
    <text x="300" y="495">4</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="42" text-anchor="middle" fill="#C3CBDA">
    <text x="480" y="315">8</text>
    <text x="480" y="495">7</text>
  </g>

  <!-- column labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.5" text-anchor="middle" fill="#5B6480">
    <text x="120" y="600">PHYSICAL</text>
    <text x="300" y="600">MIND</text>
    <text x="480" y="600">SPIRITUAL</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8891A6">
    <text x="40" y="638">Arrows of Pythagoras · complete lines shown in blue · dashed circles mark absent numbers</text>
  </g>
</svg>
